<footer class="footer bg-admin-light text-admin-dark py-5 mt-auto">
  <div class="container">

    <div class="row align-items-center">

      <div class="col-md-6 mb-4 text-center text-md-start">
        <h5 class="fw-bold mb-3">Contactez-nous</h5>
        <form (submit)="onSubmit($event)">
          <div class="mb-2">
            <input type="text" class="form-control" placeholder="Votre nom" required>
          </div>
          <div class="mb-2">
            <input type="email" class="form-control" placeholder="Votre email" required>
          </div>
          <div class="mb-2">
            <textarea class="form-control" rows="3" placeholder="Votre message" required></textarea>
          </div>
          <button type="submit" class="btn btn-admin">Envoyer</button>
        </form>
      </div>

      <div class="col-md-6 mb-4 d-flex flex-column justify-content-center align-items-center">
        <h5 class="fw-bold mb-3 text-center">Suivez-nous</h5>
        <div class="d-flex justify-content-center justify-content-md-between gap-4 w-100">
          <a href="https://www.facebook.com" target="####" rel="####">
            <i class="bi bi-facebook fs-3 text-admin-dark"></i>
          </a>
          <a href="https://www.instagram.com" target="####" rel="####">
            <i class="bi bi-instagram fs-3 text-admin-dark"></i>
          </a>
          <a href="https://www.youtube.com" target="####" rel="####">
            <i class="bi bi-youtube fs-3 text-admin-dark"></i>
          </a>
          <a href="https://www.pinterest.com" target="####" rel="####">
            <i class="bi bi-pinterest fs-3 text-admin-dark"></i>
          </a>
        </div>
      </div>

    </div>

    <div class="text-center mt-4 small text-muted">
      &copy; 2026 Liberty Ceramique. Tous droits réservés.
    </div>

  </div>
</footer>
